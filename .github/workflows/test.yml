name: Test Project

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      # 1. Updated to v7 (Modern standard for performance & security)
      - uses: actions/checkout@v7 
        # ❌ Removed the invalid 'node-version' parameter from here

      - run: npm ci
      - run: npm test
      - run: npm run build